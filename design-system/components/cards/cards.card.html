<!-- @dsCard group="Components" viewport="700x260" name="Cards" subtitle="Surface, muted, dark, accent card fills" -->
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card } = window.ApexDesignSystem_659910;
function App(){
  return (
    <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:16, padding:28}}>
      <Card variant="surface"><div style={{font:'var(--text-body-m)'}}>Surface</div></Card>
      <Card variant="muted"><div style={{font:'var(--text-body-m)'}}>Muted</div></Card>
      <Card variant="dark"><div style={{font:'var(--text-body-m)'}}>Dark</div></Card>
      <Card variant="accent"><div style={{font:'var(--text-body-m)'}}>Accent</div></Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
