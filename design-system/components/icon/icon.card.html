<html>
<head>

<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);}</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { Icon } = window.ApexDesignSystem_659910;
const names = ['dumbbell','coffee','droplet','watch','heart','zap','mic','activity','flame','footprints','route','target','layers','gauge','settings','user','search','bell','sparkles','chevron-right','check','x','plus','arrow-up-right'].filter(n => window.ApexDesignSystem_659910);
function App(){
  const list = ['dumbbell','coffee','droplet','watch','heart','zap','mic','activity','flame','footprints','route','target','layers','gauge','settings','user','search','sparkles','chevron-right','check','x','plus','arrow-up-right','send-horizontal','circle'];
  return (
    <div style={{display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap: 16, padding: 24}}>
      {list.map(n => (
        <div key={n} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:6, background:'#fff', borderRadius:14, padding:'12px 6px'}}>
          <Icon name={n} size={22} />
          <span style={{fontSize:9, color:'var(--text-secondary)'}}>{n}</span>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
