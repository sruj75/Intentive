<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg-app);font-family:var(--font-body);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ChatBubble, ChatInput } = window.ApexDesignSystem_659910;
function App(){
  return (
    <div style={{padding:24, background:'var(--bg-surface-dark)', borderRadius:24, display:'flex', flexDirection:'column', gap:14}}>
      <ChatBubble from="user" surface="dark">How many calories did I burn yesterday?</ChatBubble>
      <ChatBubble from="bot" surface="dark" timestamp="2 hours ago">You burned 420 kcal across 3 activities</ChatBubble>
      <ChatInput placeholder="Type something.." />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
