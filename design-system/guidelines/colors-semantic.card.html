<!-- @dsCard group="Colors" viewport="700x160" name="Semantic Surfaces" subtitle="How base colors map to real UI roles" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--apex-gray-50);padding:20px;box-sizing:border-box;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .card{border-radius:16px;padding:14px;font-size:12px;height:90px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;}
</style></head>
<body>
<div class="grid">
  <div class="card" style="background:var(--bg-surface);box-shadow:var(--shadow-card);">bg-surface<br><b>white card</b></div>
  <div class="card" style="background:var(--bg-surface-muted);">bg-surface-muted<br><b>goal / stat tile</b></div>
  <div class="card" style="background:var(--bg-surface-dark);color:#fff;">bg-surface-dark<br><b>sidebar / chat</b></div>
  <div class="card" style="background:var(--accent);color:#fff;">accent<br><b>CTA / tip card</b></div>
</div>
</body></html>
