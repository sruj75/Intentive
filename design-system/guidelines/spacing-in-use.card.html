<!-- @dsCard group="Spacing" viewport="700x180" name="Card Padding In Use" subtitle="20–28px internal padding is the norm for cards" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--apex-gray-50);padding:24px;box-sizing:border-box;display:flex;gap:16px;}</style></head>
<body>
<div style="background:#fff;border-radius:var(--radius-m);padding:20px;box-shadow:var(--shadow-card);font-family:var(--font-body);font-size:12px;outline:1px dashed var(--accent);outline-offset:-20px;">20px padding</div>
<div style="background:#fff;border-radius:var(--radius-m);padding:24px;box-shadow:var(--shadow-card);font-family:var(--font-body);font-size:12px;outline:1px dashed var(--accent);outline-offset:-24px;">24px padding</div>
<div style="background:#fff;border-radius:var(--radius-m);padding:28px;box-shadow:var(--shadow-card);font-family:var(--font-body);font-size:12px;outline:1px dashed var(--accent);outline-offset:-28px;">28px padding</div>
</body></html>
