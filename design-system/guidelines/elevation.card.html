<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Ambient card shadows + neumorphic pillows + accent bloom" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--apex-gray-50);padding:26px;box-sizing:border-box;display:flex;gap:26px;align-items:center;font-family:var(--font-body);font-size:11px;color:var(--text-secondary);}
.box{width:100px;height:80px;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;}
</style></head>
<body>
<div class="box" style="box-shadow:var(--shadow-card);">card</div>
<div class="box" style="box-shadow:var(--shadow-raised);">raised</div>
<div style="width:72px;height:72px;border-radius:50%;background:var(--apex-gray-50);box-shadow:var(--shadow-neumorph);display:flex;align-items:center;justify-content:center;">neumorph</div>
<div style="width:120px;height:44px;border-radius:999px;background:var(--track-bg);box-shadow:var(--shadow-inset-groove);display:flex;align-items:center;padding:5px;box-sizing:border-box;"><div style="width:50%;height:100%;border-radius:999px;background:#fff;box-shadow:var(--shadow-fill-pill);"></div></div>
<div class="box" style="box-shadow:var(--shadow-accent-glow);background:var(--accent);color:#fff;">accent bloom</div>
</body></html>
