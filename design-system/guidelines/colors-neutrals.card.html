<html><head><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:#fff;}
  .row{display:flex;height:150px;}
  .sw{flex:1;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:11px;color:#000;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--apex-white);border-right:1px solid #eee;">white</div>
  <div class="sw" style="background:var(--apex-gray-50);">gray-50</div>
  <div class="sw" style="background:var(--apex-gray-100);">gray-100</div>
  <div class="sw" style="background:var(--apex-gray-300);">gray-300</div>
  <div class="sw" style="background:var(--apex-gray-500);color:#fff;">gray-500</div>
  <div class="sw" style="background:var(--apex-gray-700);color:#fff;">gray-700</div>
  <div class="sw" style="background:var(--apex-charcoal);color:#fff;">charcoal</div>
  <div class="sw" style="background:var(--apex-black);color:#fff;">black</div>
</div>
</body></html>
