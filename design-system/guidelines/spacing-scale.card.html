<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#fff;padding:24px;box-sizing:border-box;display:flex;align-items:flex-end;gap:10px;}
.bar{background:var(--accent);border-radius:4px;}
.lbl{font-family:var(--font-body);font-size:10px;color:var(--text-secondary);text-align:center;margin-top:6px;}
</style></head>
<body>
<div>
  <div style="display:flex;align-items:flex-end;gap:10px;height:80px;">
    <div class="bar" style="width:4px;height:4px;"></div>
    <div class="bar" style="width:8px;height:8px;"></div>
    <div class="bar" style="width:12px;height:12px;"></div>
    <div class="bar" style="width:16px;height:16px;"></div>
    <div class="bar" style="width:20px;height:20px;"></div>
    <div class="bar" style="width:24px;height:24px;"></div>
    <div class="bar" style="width:28px;height:28px;"></div>
    <div class="bar" style="width:32px;height:32px;"></div>
    <div class="bar" style="width:40px;height:40px;"></div>
    <div class="bar" style="width:48px;height:48px;"></div>
    <div class="bar" style="width:64px;height:64px;"></div>
  </div>
  <div style="display:flex;gap:10px;">
    <div class="lbl" style="width:4px;">4</div><div class="lbl" style="width:8px;">8</div><div class="lbl" style="width:12px;">12</div>
    <div class="lbl" style="width:16px;">16</div><div class="lbl" style="width:20px;">20</div><div class="lbl" style="width:24px;">24</div>
    <div class="lbl" style="width:28px;">28</div><div class="lbl" style="width:32px;">32</div><div class="lbl" style="width:40px;">40</div>
    <div class="lbl" style="width:48px;">48</div><div class="lbl" style="width:64px;">64</div>
  </div>
</div>
</body></html>
