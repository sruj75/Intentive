<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:#fff;padding:24px;box-sizing:border-box;display:flex;gap:16px;align-items:center;font-family:var(--font-body);font-size:11px;color:var(--text-secondary);}
.box{background:var(--apex-gray-100);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
</style></head>
<body>
<div class="box" style="width:100px;height:100px;border-radius:var(--radius-s);">12px</div>
<div class="box" style="width:100px;height:100px;border-radius:var(--radius-m);">20px</div>
<div class="box" style="width:100px;height:100px;border-radius:var(--radius-l);">28px</div>
<div class="box" style="width:100px;height:100px;border-radius:var(--radius-xl);">36px</div>
<div class="box" style="width:100px;height:60px;border-radius:var(--radius-pill);">pill</div>
<div class="box" style="width:64px;height:64px;border-radius:var(--radius-circle);">circle</div>
</body></html>
