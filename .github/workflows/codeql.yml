name: codeql

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: CodeQL Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  javascript-typescript:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  swift:
    name: CodeQL Swift
    runs-on: macos-latest
    env:
      INTENTIVE_SWIFTPM_SCRATCH_PATH: ${{ github.workspace }}/.build/swiftpm-codeql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build maintained Swift sources
        run: >-
          bash apps/desktop/macos/scripts/swiftpm.sh build -c debug
          --package-path apps/desktop/macos/Desktop
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  security:
    name: Security
    if: always()
    needs:
      - actions
      - javascript-typescript
      - swift
    runs-on: ubuntu-latest
    steps:
      - name: Require every CodeQL language
        env:
          ACTIONS_RESULT: ${{ needs.actions.result }}
          JAVASCRIPT_TYPESCRIPT_RESULT: ${{ needs.javascript-typescript.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
        run: |
          test "$ACTIONS_RESULT" = success
          test "$JAVASCRIPT_TYPESCRIPT_RESULT" = success
          test "$SWIFT_RESULT" = success
