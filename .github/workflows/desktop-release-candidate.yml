name: desktop-release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Untagged candidate commit to accept
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-acceptance:
    runs-on: [self-hosted, macOS, ARM64, intentive-desktop]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || {
            echo "Desktop candidates must already be merged to main." >&2
            exit 1
          }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run external AX candidate acceptance
        run: pnpm --dir apps/desktop acceptance:assembled
      - name: Upload exact-SHA evidence
        uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate-${{ inputs.candidate_sha }}
          path: |
            .context/desktop-assembled-acceptance.json
            .context/desktop-assembled-evidence/
          if-no-files-found: error
