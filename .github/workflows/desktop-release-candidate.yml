name: desktop-release-candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Untagged candidate commit to accept
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-acceptance:
    runs-on: [self-hosted, macOS, ARM64, intentive-desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          lfs: true
      - name: Verify and check out exact candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate_sha must be a full lowercase commit SHA." >&2
            exit 1
          }
          git cat-file -e "$CANDIDATE_SHA^{commit}" || {
            echo "Candidate commit is not present in main's history." >&2
            exit 1
          }
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main || {
            echo "Desktop candidates must already be merged to main." >&2
            exit 1
          }
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic Desktop check
        run: pnpm --dir apps/desktop desktop:check
      - name: Run external AX candidate acceptance
        run: pnpm --dir apps/desktop desktop:accept
      - name: Digest step-level evidence
        id: evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          result=".context/desktop-assembled-acceptance.json"
          test -s "$result" || { echo "acceptance result missing" >&2; exit 1; }
          # Bind the digest to the evidence tree and the exact SHA it was produced
          # against, so a reviewer can prove the uploaded artifact is the one CI ran.
          digest="$(
            {
              shasum -a 256 "$result"
              find .context/desktop-assembled-evidence -type f -exec shasum -a 256 {} + \
                | sort
            } | shasum -a 256 | awk '{print $1}'
          )"
          printf '%s  %s\n' "$digest" "$CANDIDATE_SHA" \
            > .context/desktop-candidate-evidence.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Candidate evidence digest $digest for $CANDIDATE_SHA"
      - name: Upload exact-SHA evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-candidate-${{ inputs.candidate_sha }}
          path: |
            .context/desktop-assembled-acceptance.json
            .context/desktop-assembled-evidence/
            .context/desktop-candidate-evidence.sha256
          if-no-files-found: error
