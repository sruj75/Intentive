name: desktop-release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: SHA accepted by desktop-release-candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful desktop-release-candidate workflow run ID
        required: true
        type: string
      release_version:
        description: Semver without desktop-v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  # Reuse the established pre-Omi Developer ID release identity.
  SIGNING_IDENTITY: "Developer ID Application: Srujan Gowda (24D6NXS6H7)"

jobs:
  release:
    runs-on: macos-latest
    environment: desktop-release-approval
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify protected candidate evidence
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION: ${{ inputs.release_version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+][0-9]+)?$ ]] || {
            echo "Invalid Desktop release version: $VERSION" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p .context/candidate-evidence
          gh run view "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json workflowName,conclusion,event \
            > .context/candidate-evidence/run.json
          python3 - .context/candidate-evidence/run.json <<'PY'
          import json, pathlib, sys
          run = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if run.get("workflowName") != "desktop-release-candidate":
              raise SystemExit("candidate evidence came from the wrong workflow")
          if run.get("conclusion") != "success" or run.get("event") != "workflow_dispatch":
              raise SystemExit("candidate evidence workflow was not a successful manual run")
          PY
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "desktop-candidate-$CANDIDATE_SHA" \
            --dir .context/candidate-evidence
          python3 - "$CANDIDATE_SHA" .context/candidate-evidence/desktop-assembled-acceptance.json <<'PY'
          import json, pathlib, sys
          expected, path = sys.argv[1], pathlib.Path(sys.argv[2])
          evidence = json.loads(path.read_text())
          if not evidence.get("ok") or evidence.get("gitSHA") != expected:
              raise SystemExit("candidate AX evidence does not accept the requested SHA")
          PY
          RELEASE_TAG="desktop-v$VERSION"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        run: |
          VERSION="${RELEASE_TAG#desktop-v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          if [[ "$VERSION" == *"+"* ]]; then
            BUILD_NUMBER="${VERSION##*+}"
            VERSION="${VERSION%%+*}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Validate public release signing configuration
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DESKTOP_SENTRY_DSN: ${{ vars.DESKTOP_SENTRY_DSN }}
          DESKTOP_POSTHOG_PROJECT_KEY: ${{ secrets.DESKTOP_POSTHOG_PROJECT_KEY }}
        run: |
          missing=()
          for secret_name in \
            APPLE_DEVELOPER_ID_CERT \
            APPLE_DEVELOPER_ID_CERT_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            SPARKLE_PUBLIC_ED_KEY \
            SPARKLE_PRIVATE_KEY \
            DESKTOP_SENTRY_DSN \
            DESKTOP_POSTHOG_PROJECT_KEY; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required public release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify Desktop
        run: |
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop release:smoke

      - name: Build app bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          DESKTOP_SENTRY_DSN: ${{ vars.DESKTOP_SENTRY_DSN }}
          DESKTOP_POSTHOG_PROJECT_KEY: ${{ secrets.DESKTOP_POSTHOG_PROJECT_KEY }}
        run: |
          APP_BUNDLE="$(
            CONFIGURATION=release \
              INTENTIVE_APP_NAME=Intentive \
              INTENTIVE_BUNDLE_ID=com.heyintentive.desktop \
              INTENTIVE_APP_VERSION="$VERSION" \
              INTENTIVE_APP_BUILD="$BUILD_NUMBER" \
              INTENTIVE_AUTH_CALLBACK_SCHEME=intentive-desktop \
              INTENTIVE_SPARKLE_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
              INTENTIVE_SPARKLE_PUBLIC_ED_KEY="${SPARKLE_PUBLIC_ED_KEY:-}" \
              INTENTIVE_SENTRY_DSN="${DESKTOP_SENTRY_DSN:-}" \
              INTENTIVE_POSTHOG_PROJECT_KEY="${DESKTOP_POSTHOG_PROJECT_KEY:-}" \
              INTENTIVE_POSTHOG_HOST="https://us.i.posthog.com" \
              apps/desktop/macos/scripts/build-app-bundle.sh | tail -n 1
          )"
          [[ -d "$APP_BUNDLE" ]] || { echo "Missing app bundle: $APP_BUNDLE" >&2; exit 1; }
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${APPLE_DEVELOPER_ID_CERT:-}" ]]; then
            echo "No Developer ID certificate configured; producing unsigned release artifact."
            exit 0
          fi
          echo "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Codesign app
        run: |
          for framework in \
            "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework" \
            "$APP_BUNDLE/Contents/Frameworks/Sentry.framework"; do
            codesign --force --options runtime --timestamp --deep --sign "$SIGNING_IDENTITY" "$framework"
          done
          codesign --force --options runtime --timestamp --deep \
            --entitlements apps/desktop/macos/Desktop/Intentive-Release.entitlements \
            --sign "$SIGNING_IDENTITY" \
            "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Create DMG
        run: |
          mkdir -p dist
          DMG_ROOT="$RUNNER_TEMP/intentive-dmg-root"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_BUNDLE" "$DMG_ROOT/Intentive.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "Intentive" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "dist/Intentive-$VERSION.dmg"

      - name: Codesign DMG
        run: |
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "dist/Intentive-$VERSION.dmg"
          codesign --verify --verbose=2 "dist/Intentive-$VERSION.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "No Apple notarization credentials configured; skipping notarization."
            exit 0
          fi
          DMG="dist/Intentive-$VERSION.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          DMG="Intentive-$VERSION.dmg"
          DMG_PATH="dist/$DMG"
          DMG_BYTES="$(stat -f%z "$DMG_PATH")"
          SPARKLE_SIGN_UPDATE="$(find "$(scripts/development-storage.sh path swiftpm-desktop)" -path '*/Sparkle/bin/sign_update' -type f -perm -111 | head -n 1)"
          [[ -x "$SPARKLE_SIGN_UPDATE" ]] || { echo "Sparkle sign_update tool not found" >&2; exit 1; }
          SIGNATURE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_SIGN_UPDATE" --ed-key-file - -p "$DMG_PATH")"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Intentive Desktop Updates</title>
              <item>
                <title>Intentive $VERSION</title>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S %z")</pubDate>
                <enclosure
                  url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$DMG"
                  sparkle:edSignature="$SIGNATURE"
                  length="$DMG_BYTES"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Audit signed release artifacts
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_SIGN_UPDATE="$(find "$(scripts/development-storage.sh path swiftpm-desktop)" -path '*/Sparkle/bin/sign_update' -type f -perm -111 | head -n 1)"
          PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          cleanup_private_key() {
            rm -f "$PRIVATE_KEY_FILE"
          }
          trap cleanup_private_key EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          chmod 600 "$PRIVATE_KEY_FILE"
          apps/desktop/macos/scripts/smoke-signed-desktop-artifact.sh \
            --app "$APP_BUNDLE" \
            --dmg "dist/Intentive-$VERSION.dmg" \
            --appcast dist/appcast.xml \
            --tag "$RELEASE_TAG" \
            --build "$BUILD_NUMBER" \
            --expected-team-id "$APPLE_TEAM_ID" \
            --sparkle-sign-tool "$SPARKLE_SIGN_UPDATE" \
            --sparkle-private-key "$PRIVATE_KEY_FILE" \
            --result-json dist/desktop-release-acceptance.json
          rm -f "$PRIVATE_KEY_FILE"
          trap - EXIT

      # The tag becomes remote only after configuration, build, signing,
      # notarization, appcast generation, and signed-artifact smoke all pass.
      - name: Create accepted release tag
        run: |
          git tag --annotate "$RELEASE_TAG" "$CANDIDATE_SHA" \
            --message "Intentive Desktop $VERSION"
          git push origin "$RELEASE_TAG"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.dmg
            dist/appcast.xml
            dist/desktop-release-acceptance.json
          draft: true
          generate_release_notes: true

  stage2-proof-and-publish:
    needs: release
    runs-on: [self-hosted, macOS, ARM64, intentive-desktop]
    environment: desktop-release-stage2-proof
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      INTENTIVE_NEON_AUTH_URL: ${{ vars.INTENTIVE_NEON_AUTH_URL }}
      INTENTIVE_CONTROL_PLANE_URL: ${{ vars.INTENTIVE_CONTROL_PLANE_URL }}
      DESKTOP_RELEASE_TEST_ACCOUNT_EMAIL: ${{ secrets.DESKTOP_RELEASE_TEST_ACCOUNT_EMAIL }}
      DESKTOP_RELEASE_TEST_ACCOUNT_PASSWORD: ${{ secrets.DESKTOP_RELEASE_TEST_ACCOUNT_PASSWORD }}
      DESKTOP_RELEASE_TEST_USER_ID: ${{ vars.DESKTOP_RELEASE_TEST_USER_ID }}
      DESKTOP_STAGE2_OPERATOR: ${{ vars.DESKTOP_STAGE2_OPERATOR }}
      DESKTOP_STAGE2_NOTARY_PROFILE: ${{ vars.DESKTOP_STAGE2_NOTARY_PROFILE }}
      TART_BASE_IMAGE: ${{ vars.TART_BASE_IMAGE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve repository-owned Stage 2 drivers
        run: |
          {
            echo "DESKTOP_STAGE2_SPARKLE_DRIVER=$GITHUB_WORKSPACE/apps/desktop/macos/scripts/stage2/sparkle-n1-update-driver.sh"
            echo "DESKTOP_STAGE2_TART_DRIVER=$GITHUB_WORKSPACE/apps/desktop/macos/scripts/stage2/tart-clean-tcc-driver.sh"
            echo "DESKTOP_STAGE2_FULL_STACK_DRIVER=$GITHUB_WORKSPACE/apps/desktop/macos/scripts/stage2/full-stack-signed-in-driver.sh"
            echo "DESKTOP_RELEASE_TEST_CLEANUP_RECEIPT=$RUNNER_TEMP/desktop-stage2-neon-cleanup-receipt.json"
          } >> "$GITHUB_ENV"
      - name: Download the exact draft candidate
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.dmg' --pattern appcast.xml
          test "$(find dist -name '*.dmg' -type f | wc -l | tr -d ' ')" = 1
      - name: Execute installed-DMG, Sparkle N-1, Tart TCC, and signed-in proof
        run: |
          DMG="$(find dist -name '*.dmg' -type f -print -quit)"
          EVIDENCE_DIR="$RUNNER_TEMP/intentive-stage2-proof-$GITHUB_RUN_ID"
          pnpm --dir apps/desktop desktop:release-proof \
            --dmg "$DMG" \
            --appcast dist/appcast.xml \
            --tag "$RELEASE_TAG" \
            --sha "$CANDIDATE_SHA" \
            --output "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
      - name: Attach Stage 2 proof and publish
        run: |
          EVIDENCE_ARCHIVE="$RUNNER_TEMP/intentive-stage2-proof-$GITHUB_RUN_ID.tar.gz"
          tar -C "$EVIDENCE_DIR" -czf "$EVIDENCE_ARCHIVE" .
          shasum -a 256 "$EVIDENCE_ARCHIVE" > "$EVIDENCE_ARCHIVE.sha256"
          gh release upload "$RELEASE_TAG" \
            "$EVIDENCE_ARCHIVE" "$EVIDENCE_ARCHIVE.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
