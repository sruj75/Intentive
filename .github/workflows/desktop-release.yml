name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        run: |
          if [[ "${GITHUB_REF_NAME}" == desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          if [[ "$VERSION" == *"+"* ]]; then
            BUILD_NUMBER="${VERSION##*+}"
            VERSION="${VERSION%%+*}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Validate public release signing configuration
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_EDDSA_SIGNATURE: ${{ secrets.SPARKLE_EDDSA_SIGNATURE }}
          DESKTOP_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN }}
          DESKTOP_POSTHOG_PROJECT_KEY: ${{ secrets.DESKTOP_POSTHOG_PROJECT_KEY }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Workflow-dispatch smoke builds may be unsigned."
            exit 0
          fi

          missing=()
          for secret_name in \
            APPLE_DEVELOPER_ID_CERT \
            APPLE_DEVELOPER_ID_CERT_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID \
            SPARKLE_PUBLIC_ED_KEY \
            SPARKLE_EDDSA_SIGNATURE \
            DESKTOP_SENTRY_DSN \
            DESKTOP_POSTHOG_PROJECT_KEY; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required public release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify Desktop
        run: |
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop test

      - name: Build app bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          DESKTOP_SENTRY_DSN: ${{ secrets.DESKTOP_SENTRY_DSN }}
          DESKTOP_POSTHOG_PROJECT_KEY: ${{ secrets.DESKTOP_POSTHOG_PROJECT_KEY }}
        run: |
          APP_BUNDLE="$(
            CONFIGURATION=release \
              INTENTIVE_APP_NAME=Intentive \
              INTENTIVE_APP_VERSION="$VERSION" \
              INTENTIVE_APP_BUILD="$BUILD_NUMBER" \
              INTENTIVE_AUTH_CALLBACK_SCHEME=intentive-desktop \
              INTENTIVE_SPARKLE_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
              INTENTIVE_SPARKLE_PUBLIC_ED_KEY="${SPARKLE_PUBLIC_ED_KEY:-}" \
              INTENTIVE_SENTRY_DSN="${DESKTOP_SENTRY_DSN:-}" \
              INTENTIVE_POSTHOG_PROJECT_KEY="${DESKTOP_POSTHOG_PROJECT_KEY:-}" \
              INTENTIVE_POSTHOG_HOST="https://us.i.posthog.com" \
              apps/desktop/macos/scripts/build-app-bundle.sh | tail -n 1
          )"
          [[ -d "$APP_BUNDLE" ]] || { echo "Missing app bundle: $APP_BUNDLE" >&2; exit 1; }
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${APPLE_DEVELOPER_ID_CERT:-}" ]]; then
            echo "No Developer ID certificate configured; producing unsigned release artifact."
            exit 0
          fi
          echo "$APPLE_DEVELOPER_ID_CERT" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Codesign app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "No signing identity configured; skipping codesign."
            exit 0
          fi
          codesign --force --options runtime --timestamp --deep --sign "$APPLE_SIGNING_IDENTITY" "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Create DMG
        run: |
          mkdir -p dist
          hdiutil create \
            -volname "Intentive" \
            -srcfolder "$APP_BUNDLE" \
            -ov \
            -format UDZO \
            "dist/Intentive-$VERSION.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${APPLE_ID:-}" ]]; then
            echo "No Apple notarization credentials configured; skipping notarization."
            exit 0
          fi
          DMG="dist/Intentive-$VERSION.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_EDDSA_SIGNATURE: ${{ secrets.SPARKLE_EDDSA_SIGNATURE }}
        run: |
          DMG="Intentive-$VERSION.dmg"
          DMG_PATH="dist/$DMG"
          DMG_BYTES="$(stat -f%z "$DMG_PATH")"
          SIGNATURE="${SPARKLE_EDDSA_SIGNATURE:-unsigned-local-build}"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Intentive Desktop Updates</title>
              <item>
                <title>Intentive $VERSION</title>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <pubDate>$(date -u +"%a, %d %b %Y %H:%M:%S %z")</pubDate>
                <enclosure
                  url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$DMG"
                  sparkle:edSignature="$SIGNATURE"
                  length="$DMG_BYTES"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/appcast.xml
          generate_release_notes: true
