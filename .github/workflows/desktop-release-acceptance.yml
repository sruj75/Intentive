name: desktop-release-acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft desktop-v* release tag to accept
        required: true
        type: string
      publish:
        description: Publish the draft release after every gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  dedicated-mac-acceptance:
    runs-on: [self-hosted, macOS, ARM64, intentive-desktop]

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+([+][0-9]+)?$ ]] || {
            echo "Invalid Desktop release tag: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic assembled journeys
        run: pnpm --dir apps/desktop acceptance:assembled

      - name: Download draft release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern 'Intentive-*.dmg' \
            --pattern appcast.xml \
            --pattern desktop-release-acceptance.json

      - name: Mount release DMG and copy installed payload
        run: |
          DMG_PATH="$(find dist -maxdepth 1 -name 'Intentive-*.dmg' -type f | head -n 1)"
          [[ -n "$DMG_PATH" ]] || { echo "Release DMG missing" >&2; exit 1; }
          MOUNTPOINT="$RUNNER_TEMP/intentive-release-mount"
          cleanup_mount() {
            hdiutil detach "$MOUNTPOINT" -quiet >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          rm -rf "$MOUNTPOINT" "$RUNNER_TEMP/Intentive.app"
          mkdir -p "$MOUNTPOINT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNTPOINT"
          ditto "$MOUNTPOINT/Intentive.app" "$RUNNER_TEMP/Intentive.app"
          hdiutil detach "$MOUNTPOINT"
          trap - EXIT
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "APP_BUNDLE=$RUNNER_TEMP/Intentive.app" >> "$GITHUB_ENV"

      - name: Verify published evidence digest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - \
            "$DMG_PATH" \
            dist/appcast.xml \
            "$APP_BUNDLE" \
            dist/desktop-release-acceptance.json \
            "$RELEASE_TAG" <<'PY'
          import hashlib
          import json
          import pathlib
          import plistlib
          import sys

          dmg, appcast, app, evidence_path = map(pathlib.Path, sys.argv[1:5])
          release_tag = sys.argv[5]
          evidence = json.loads(evidence_path.read_text())
          if evidence.get("release_tag") != release_tag:
              raise SystemExit(
                  f"release evidence tag mismatch: expected {release_tag}, "
                  f"got {evidence.get('release_tag')}"
              )

          expected = {
              artifact["label"]: artifact["sha256"]
              for artifact in evidence["artifacts"]
          }
          plist = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          executable = app / "Contents/MacOS" / plist["CFBundleExecutable"]
          artifacts = {
              "dmg": dmg,
              "appcast": appcast,
              "app_executable": executable,
          }
          for label, path in artifacts.items():
              if label not in expected:
                  raise SystemExit(f"release evidence is missing {label} digest")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected[label]:
                  raise SystemExit(
                      f"{label} digest mismatch: expected {expected[label]}, got {actual}"
                  )
          PY

      - name: Audit and launch the signed installed artifact
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          INTENTIVE_SIGNED_ARTIFACT_SMOKE_ALLOW_PRODUCTION_LAUNCH: "1"
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Contents/Info.plist")"
          SPARKLE_SIGN_UPDATE="$(find "$(scripts/development-storage.sh path swiftpm-desktop)" -path '*/Sparkle/bin/sign_update' -type f -perm -111 | head -n 1)"
          PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          cleanup_private_key() {
            rm -f "$PRIVATE_KEY_FILE"
          }
          trap cleanup_private_key EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          chmod 600 "$PRIVATE_KEY_FILE"
          apps/desktop/macos/scripts/smoke-signed-desktop-artifact.sh \
            --app "$APP_BUNDLE" \
            --dmg "$DMG_PATH" \
            --appcast dist/appcast.xml \
            --tag "$RELEASE_TAG" \
            --build "$BUILD_NUMBER" \
            --expected-team-id "$APPLE_TEAM_ID" \
            --sparkle-sign-tool "$SPARKLE_SIGN_UPDATE" \
            --sparkle-private-key "$PRIVATE_KEY_FILE" \
            --launch \
            --result-json .context/dedicated-mac-release-acceptance.json
          rm -f "$PRIVATE_KEY_FILE"
          trap - EXIT

      - name: Upload dedicated-Mac evidence
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-acceptance-${{ inputs.release_tag }}
          path: |
            .context/desktop-assembled-acceptance.json
            .context/dedicated-mac-release-acceptance.json
          if-no-files-found: error

      - name: Publish accepted release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
