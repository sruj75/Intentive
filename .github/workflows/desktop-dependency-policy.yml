name: desktop-dependency-policy

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-dependency-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-dependencies:
    name: Desktop dependency policy
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Swift package dependencies
        env:
          INTENTIVE_SWIFTPM_SCRATCH_PATH: ${{ github.workspace }}/.build/swiftpm-policy
        run: |
          bash apps/desktop/macos/scripts/swiftpm.sh package \
            --package-path apps/desktop/macos/Desktop show-dependencies \
            | tee "$RUNNER_TEMP/swift-dependencies.txt"

      - name: Verify no provider SDK is bundled
        run: |
          if grep -Ei 'firebase|openai|anthropic|gemini|deepgram' "$RUNNER_TEMP/swift-dependencies.txt"; then
            echo "Provider SDK dependency found in Desktop package." >&2
            exit 1
          fi
