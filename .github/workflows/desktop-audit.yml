name: desktop-audit

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-dependencies:
    name: SwiftPM dependency audit
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Swift package dependencies
        run: xcrun swift package --package-path apps/desktop/macos/Desktop show-dependencies

      - name: Verify no provider SDK is bundled
        run: |
          if xcrun swift package --package-path apps/desktop/macos/Desktop show-dependencies | grep -Ei 'firebase|openai|anthropic|gemini|deepgram'; then
            echo "Provider SDK dependency found in Desktop package." >&2
            exit 1
          fi
