name: security-audit

# JS dependency audit. Pull requests only run this workflow when pnpm dependency
# inputs change, so code-only PRs do not spend time on the slow `pnpm audit`
# registry call. The weekly/manual path still runs the full workspace audit to
# catch newly-disclosed advisories in unchanged dependencies.
# Desktop provider-SDK dependency policy lives in desktop-dependency-policy.yml.

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/**/package.json"
      - "services/**/package.json"
      - "packages/**/package.json"
      - "tools/**/package.json"
      - "marketing/package.json"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        if: github.event_name == 'pull_request'
        run: pnpm audit --prod --audit-level moderate

      - name: Audit all dependencies
        if: github.event_name != 'pull_request'
        run: pnpm audit --audit-level moderate
