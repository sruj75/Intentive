name: coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-swift:
    name: Desktop Swift coverage
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test with coverage
        run: xcrun swift test --package-path apps/desktop/macos/Desktop --enable-code-coverage

      - name: Archive coverage data
        uses: actions/upload-artifact@v7
        with:
          name: desktop-swift-coverage
          path: apps/desktop/macos/Desktop/.build/**/*.profdata
          if-no-files-found: warn
