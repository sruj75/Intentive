name: coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-swift:
    name: Desktop Swift coverage
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test with coverage
        env:
          INTENTIVE_SWIFTPM_SCRATCH_PATH: ${{ github.workspace }}/.build/swiftpm-coverage
        run: bash apps/desktop/macos/scripts/swiftpm.sh test --package-path apps/desktop/macos/Desktop --enable-code-coverage

      - name: Archive coverage data
        uses: actions/upload-artifact@v7
        with:
          name: desktop-swift-coverage
          path: .build/swiftpm-coverage/**/*.profdata
          if-no-files-found: warn
