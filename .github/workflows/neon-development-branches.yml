name: neon-development-branches

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "services/control-plane/**"
      - "services/agent-runtime/**"
      - "packages/api-contract/**"
      - "packages/domain-types/**"
      - "packages/protocol/**"
      - "packages/providers/**"
      - ".github/workflows/neon-development-branches.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    # Dependabot runs cannot read repository secrets (NEON_API_KEY), and its PRs
    # never need a disposable Development branch, so skip these jobs entirely.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'pull_request' &&
      (github.event.action == 'synchronize' ||
      github.event.action == 'opened' ||
      github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get branch expiration date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: development/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Control Plane migrations
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
        run: pnpm --filter ./services/control-plane migrate

      - name: Apply Agent Runtime migrations
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
        run: pnpm --filter ./services/agent-runtime migrate

      - name: Delete temporary Development branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        if: always() && steps.create_neon_branch.outcome == 'success'
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: development/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
