name: monorepo-foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository contract Gate
        run: pnpm harness --group repo-contracts

  node-workspaces:
    name: Node workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Node workspace Gate
        run: pnpm harness --group node-workspaces

  desktop-swift:
    name: Desktop Swift
    runs-on: macos-latest
    env:
      INTENTIVE_SWIFTPM_SCRATCH_PATH: ${{ github.workspace }}/.build/swiftpm-gate
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run Desktop Swift Gate
        run: pnpm harness --group desktop-swift
      - name: Add coverage summary
        if: always() && hashFiles('.context/coverage/desktop-swift-summary.md') != ''
        run: cat .context/coverage/desktop-swift-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reviewable Swift coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-swift-coverage
          path: |
            .context/coverage/desktop-swift.json
            .context/coverage/desktop-swift-summary.md
          if-no-files-found: error

  gate:
    name: Gate
    if: always()
    needs:
      - repo-contracts
      - node-workspaces
      - desktop-swift
    runs-on: ubuntu-latest
    steps:
      - name: Require every Gate module
        env:
          REPO_CONTRACTS: ${{ needs.repo-contracts.result }}
          NODE_WORKSPACES: ${{ needs.node-workspaces.result }}
          DESKTOP_SWIFT: ${{ needs.desktop-swift.result }}
        run: |
          test "$REPO_CONTRACTS" = success
          test "$NODE_WORKSPACES" = success
          test "$DESKTOP_SWIFT" = success
