name: monorepo-foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      swift: ${{ steps.filter.outputs['ci-infra'] == 'true' || steps.swift-filter.outputs.swift == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yml
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: swift-filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yml
          predicate-quantifier: every

  repo-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository contract Gate
        run: pnpm harness --group repo-contracts

  node-workspaces:
    name: Node workspaces
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Node workspace Gate
        run: pnpm harness --group node-workspaces

  desktop-swift:
    name: Desktop Swift
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    env:
      INTENTIVE_SWIFTPM_SCRATCH_PATH: ${{ github.workspace }}/.build/swiftpm-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Run Desktop Swift Gate
        run: pnpm harness --group desktop-swift
      - name: Add coverage summary
        if: always() && hashFiles('.context/coverage/desktop-swift-summary.md') != ''
        run: cat .context/coverage/desktop-swift-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reviewable Swift coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-swift-coverage
          path: |
            .context/coverage/desktop-swift.json
            .context/coverage/desktop-swift-summary.md
          if-no-files-found: error

  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - repo-contracts
      - node-workspaces
      - desktop-swift
    runs-on: ubuntu-latest
    steps:
      - name: Require every Gate module
        env:
          REPO_CONTRACTS: ${{ needs.repo-contracts.result }}
          NODE_WORKSPACES: ${{ needs.node-workspaces.result }}
          DESKTOP_SWIFT: ${{ needs.desktop-swift.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          for result in "$NODE_WORKSPACES" "$DESKTOP_SWIFT"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
          test "$REPO_CONTRACTS" = success
          test "$CHANGES" = success
