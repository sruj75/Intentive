name: desktop-ci

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/protocol/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - "packages/protocol/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  swiftpm:
    name: SwiftPM build and test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Docs check
        run: pnpm docs:check

      - name: Desktop typecheck
        run: pnpm --dir apps/desktop typecheck

      - name: Desktop tests
        run: pnpm --dir apps/desktop test
